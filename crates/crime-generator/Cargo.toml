[package]
name = "crime-generator"
description = "Builds the Chicago crime dataset (SSTables and manifest) from the source CSV."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
clap.workspace = true
crime-dataset.workspace = true
csv.workspace = true
sha2.workspace = true
sstable.workspace = true
tempfile.workspace = true

[features]
# Deterministic failure injection for the tests (see `src/fail.rs`). The dev-dependency below turns
# it on for every test target of this crate, so `cargo test` runs the failure tests by default;
# ordinary builds never include it.
fail-points = []

[dev-dependencies]
# This crate itself, with the fail points enabled for its own tests.
crime-generator = { path = ".", features = ["fail-points"] }
# The independent read-back tests unpack tuples without the dataset crate.
foundationdb-tuple.workspace = true

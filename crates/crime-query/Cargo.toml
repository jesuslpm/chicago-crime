[package]
name = "crime-query"
description = "Query app of the Chicago crime dataset: answers indexed queries over a published dataset."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
crime-dataset.workspace = true
ctrlc.workspace = true
# Index keys are packed tuples `(value, id)`: the query app builds and decodes them itself.
foundationdb-tuple.workspace = true
serde.workspace = true
serde_json.workspace = true
sstable.workspace = true
# The output file is written next to its target and renamed over it (decision C8).
tempfile.workspace = true

[dev-dependencies]
# Only to build small datasets for the tests; the query app itself never uses the generator.
crime-generator = { path = "../crime-generator" }
# Parses the CSV output back in the tests; the app writes CSV itself (`write_csv_line`).
csv.workspace = true

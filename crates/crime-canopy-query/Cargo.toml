[package]
name = "crime-canopy-query"
description = "Query app of the Chicago crime dataset stored in a CanopyDB base: the original query app over CanopyDB."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
canopydb.workspace = true
crime-dataset.workspace = true
# Everything but the storage of the tables is the original query app's (decision K1 of the
# canopy-db PRD, KC9 of the child PRD): options, queries, output, batch, messages and codes.
crime-query = { path = "../crime-query" }
serde_json.workspace = true

[dev-dependencies]
# Only to build small datasets for the tests: the same rows published by the original generator
# and by the CanopyDB generator, so both query apps can be compared.
crime-canopy-generator = { path = "../crime-canopy-generator" }
crime-generator = { path = "../crime-generator" }
csv.workspace = true
tempfile.workspace = true
